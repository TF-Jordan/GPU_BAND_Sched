# pve-gpu-sched - GPU time-sharing scheduler for Proxmox VE / KVM
#
# Ce module permet de partager un GPU physique entre plusieurs VMs
# via l'algorithme BAND (Bandwidth-Aware Non-preemptive Dispatcher).
#
# Le module est charge automatiquement au demarrage via le service systemd.
# Pour le charger manuellement : modprobe pve_gpu_sched
#
# Options du module (a decommenter si necessaire) :
# options pve_gpu_sched
#
# Pour blacklister les drivers GPU natifs (necessaire si nvidia/amdgpu
# est charge en meme temps) :
# blacklist nouveau
# blacklist nvidia
# blacklist amdgpu
